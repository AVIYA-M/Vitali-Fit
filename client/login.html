<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaliFit - התחברות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F8F9FA] text-gray-900 font-['Heebo'] flex flex-col min-h-screen justify-center items-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-200/80 space-y-6 text-right">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-[#1E4630]">התחברות למערכת</h1>
            <p class="text-xs text-gray-500">הכנס את פרטי החשבון שלך כדי להמשיך</p>
        </div>
        <div class="flex rounded-xl bg-gray-100 p-1">
            <a href="login.html" class="flex-1 py-2.5 text-center rounded-lg font-semibold text-xs bg-[#1E4630] text-white shadow">התחברות</a>
            <a href="register.html" class="flex-1 py-2.5 text-center rounded-lg font-semibold text-xs text-gray-500 hover:text-gray-900">הרשמה</a>
        </div>
        <form onsubmit="handleAuth(event)" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-medium text-gray-700 block">כתובת אימייל</label>
                <input type="email" required placeholder="israel@example.com" class="w-full bg-gray-50 border border-gray-300 rounded-xl py-3 px-4 text-xs text-right focus:outline-none focus:border-[#1E4630]">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-medium text-gray-700 block">סיסמה</label>
                <input type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-xl py-3 px-4 text-xs text-right focus:outline-none focus:border-[#1E4630]">
            </div>
            <button type="submit" class="w-full py-3.5 bg-[#1E4630] text-white rounded-xl text-xs font-bold hover:bg-[#163524] transition-all shadow-md">התחבר</button>
        </form>
        <div class="text-center">
            <a href="index.html" class="text-xs text-gray-500 hover:text-[#1E4630]">← חזרה לדף הבית</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
